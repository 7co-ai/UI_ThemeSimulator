<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>UI Theme & App Mockup Simulator</title>
  
  <!-- Web App / PWA Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="UIカラー">
  <meta name="application-name" content="UIカラー">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23F43F5E'/><circle cx='50' cy='50' r='28' fill='%23FFFFFF'/><circle cx='50' cy='50' r='18' fill='%236366F1'/></svg>">

  <!-- CDN Tech Stack -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    [x-cloak] { display: none !important; }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    * { -webkit-tap-highlight-color: transparent; }
    @supports (-webkit-touch-callout: none) {
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
    }

    /* Pattern Backgrounds for App Screens */
    .bg-pattern-dots {
      background-image: radial-gradient(rgba(100, 116, 139, 0.22) 1.5px, transparent 1.5px);
      background-size: 14px 14px;
    }
    .bg-pattern-grid {
      background-image: linear-gradient(to right, rgba(100, 116, 139, 0.12) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(100, 116, 139, 0.12) 1px, transparent 1px);
      background-size: 16px 16px;
    }
    .bg-pattern-stripes {
      background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(100, 116, 139, 0.08) 10px, rgba(100, 116, 139, 0.08) 20px);
    }
    .bg-pattern-hearts {
      background-image: radial-gradient(circle at center, rgba(244, 63, 94, 0.15) 2px, transparent 2px),
                        radial-gradient(circle at center, rgba(244, 63, 94, 0.10) 6px, transparent 6px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
    }

    /* Mobile Carousel Snap */
    .snap-container {
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .snap-card {
      scroll-snap-align: center;
      scroll-snap-stop: always;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col font-sans select-none"
      x-data="themeSimulator()" x-cloak>

  <!-- Navigation Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 px-3 lg:px-6 py-2.5 flex items-center justify-between shadow-xs">
    <div class="flex items-center space-x-2.5">
      <div class="w-8 h-8 rounded-xl flex items-center justify-center text-white shadow font-bold transition-all shrink-0"
           :style="getStyle(palette[0], palette[1] || palette[0], useGradient)">
        <i data-lucide="palette" class="w-4 h-4"></i>
      </div>
      <div>
        <h1 class="text-sm lg:text-base font-bold leading-tight">UI Theme Simulator</h1>
        <p class="text-[10px] text-slate-400 hidden sm:block">配色・かわいい背景着せ替え検証</p>
      </div>
    </div>

    <!-- Actions Toolbar -->
    <div class="flex items-center space-x-1.5 text-xs">
      <button @click="copyCssVariables" class="p-2 sm:px-2.5 sm:py-1.5 rounded-lg border border-slate-200 hover:bg-slate-50 text-slate-700 flex items-center space-x-1 transition active:scale-95" title="CSS変数コピー">
        <i data-lucide="code" class="w-3.5 h-3.5 text-slate-600"></i>
        <span class="hidden sm:inline">CSS変数</span>
      </button>
      <button @click="copyHexList" class="p-2 sm:px-2.5 sm:py-1.5 rounded-lg border border-slate-200 hover:bg-slate-50 text-slate-700 flex items-center space-x-1 transition active:scale-95" title="HEX一覧コピー">
        <i data-lucide="copy" class="w-3.5 h-3.5 text-slate-600"></i>
        <span class="hidden sm:inline">HEX</span>
      </button>
      <button @click="exportJson" class="p-2 sm:px-2.5 sm:py-1.5 rounded-lg border border-slate-200 hover:bg-slate-50 text-slate-700 flex items-center space-x-1 transition active:scale-95" title="JSON保存">
        <i data-lucide="download" class="w-3.5 h-3.5 text-slate-600"></i>
        <span class="hidden sm:inline">保存</span>
      </button>
      <label class="p-2 sm:px-2.5 sm:py-1.5 rounded-lg border border-slate-200 hover:bg-slate-50 text-slate-700 flex items-center space-x-1 transition cursor-pointer active:scale-95" title="JSON読み込み">
        <i data-lucide="upload" class="w-3.5 h-3.5 text-slate-600"></i>
        <input type="file" accept=".json" class="hidden" @change="importJson">
      </label>
      <button @click="randomizeTheme" class="px-2.5 py-1.5 rounded-lg bg-slate-900 text-white hover:bg-slate-800 flex items-center space-x-1 shadow-sm transition active:scale-95">
        <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
        <span class="hidden sm:inline">ランダム</span>
      </button>
    </div>
  </header>

  <!-- Workspace Grid Layout -->
  <main class="flex-1 max-w-[1600px] w-full mx-auto p-3 lg:p-6 pb-24 lg:pb-6 grid grid-cols-1 lg:grid-cols-12 gap-5">

    <!-- Controls Column (Hidden on Mobile when Viewing Preview) -->
    <section class="lg:col-span-5 xl:col-span-4 space-y-4"
             :class="{ 'hidden lg:block': mobileTab === 'preview' }">

      <!-- Panel 1: Color Controller -->
      <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200"
           x-show="mobileTab === 'palette' || window.innerWidth >= 1024">
        
        <div class="flex items-center justify-between mb-3">
          <span class="text-[11px] font-bold tracking-wider text-slate-400 uppercase">パレット色数選択</span>
          <div class="inline-flex rounded-lg bg-slate-100 p-0.5">
            <template x-for="count in [2, 3, 4, 5]" :key="count">
              <button @click="setColorCount(count)"
                      class="px-2.5 py-1 text-xs font-bold rounded-md transition"
                      :class="colorCount === count ? 'bg-white shadow-xs text-indigo-600' : 'text-slate-500 hover:text-slate-800'"
                      x-text="count + '色'">
              </button>
            </template>
          </div>
        </div>

        <!-- Palette Circle Slots -->
        <div class="flex items-center justify-center gap-2 py-3 px-2 bg-slate-50 rounded-xl border border-slate-100 min-h-[90px]">
          <template x-for="(color, index) in activePalette" :key="index">
            <div class="flex flex-col items-center flex-1 max-w-[60px]">
              <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-full shadow border-2 border-white transition-transform active:scale-95 cursor-pointer relative overflow-hidden"
                   :style="`background-color: ${color}`">
                <input type="color" x-model="palette[index]" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
              </div>
              <input type="text" x-model="palette[index]" class="text-[10px] font-mono mt-1 text-center w-full px-0.5 py-0.5 border border-slate-200 rounded focus:border-indigo-500 uppercase bg-white">
            </div>
          </template>
        </div>

        <!-- Gradient vs Solid Switch -->
        <div class="mt-3 p-3 bg-slate-50 rounded-xl border border-slate-100 flex items-center justify-between">
          <div class="flex items-center space-x-2">
            <i data-lucide="blend" class="w-4 h-4 text-indigo-600"></i>
            <div>
              <div class="text-xs font-bold text-slate-700">塗りスタイル</div>
              <div class="text-[10px] text-slate-400" x-text="useGradient ? 'グラデーション' : '単色（フラット）'"></div>
            </div>
          </div>
          <button @click="useGradient = !useGradient"
                  class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none"
                  :class="useGradient ? 'bg-indigo-600' : 'bg-slate-300'">
            <span class="inline-block h-5 w-5 transform rounded-full bg-white shadow-md ring-0 transition duration-200 ease-in-out"
                  :class="useGradient ? 'translate-x-5' : 'translate-x-0'"></span>
          </button>
        </div>

        <!-- Contrast Indicator -->
        <div class="mt-2.5 px-3 py-2 bg-slate-50 rounded-xl border border-slate-100 flex items-center justify-between text-xs">
          <span class="text-[11px] text-slate-500 font-medium">白文字コントラスト比</span>
          <span class="px-2 py-0.5 rounded text-[10px] font-bold text-white shadow-xs"
                :class="isHeaderAccessible ? 'bg-emerald-600' : 'bg-amber-600'"
                x-text="isHeaderAccessible ? '良好 (視認性◎)' : '薄い色 (注意)'"></span>
        </div>

        <button @click="saveToMyPalettes" class="w-full mt-3 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold rounded-xl text-xs flex items-center justify-center space-x-1.5 transition active:scale-95">
          <i data-lucide="bookmark-plus" class="w-4 h-4"></i>
          <span>現在のカラーをマイパレットに保存</span>
        </button>
      </div>

      <!-- Panel 2: App Mockup Background Customizer -->
      <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200 space-y-3"
           x-show="mobileTab === 'bg' || window.innerWidth >= 1024">
        <div class="flex items-center justify-between">
          <h2 class="text-xs font-bold text-slate-700 flex items-center space-x-1.5">
            <i data-lucide="image" class="w-4 h-4 text-pink-500"></i>
            <span>アプリ背景カスタマイズ</span>
          </h2>
          <span class="text-[10px] px-2 py-0.5 bg-pink-50 text-pink-600 rounded-full font-bold">10種搭載</span>
        </div>

        <!-- Background Preset Grid -->
        <div class="grid grid-cols-2 gap-2 text-xs">
          <template x-for="bg in bgPresets" :key="bg.id">
            <button @click="currentBg = bg"
                    class="p-2.5 rounded-xl border text-left transition flex items-center space-x-2.5"
                    :class="currentBg.id === bg.id ? 'border-pink-500 bg-pink-50/50 shadow-xs ring-1 ring-pink-400' : 'border-slate-200 bg-slate-50 hover:bg-white'">
              <div class="w-7 h-7 rounded-lg border border-slate-300/60 shrink-0 shadow-xs"
                   :class="bg.patternClass"
                   :style="bg.style"></div>
              <div class="truncate">
                <div class="font-bold text-[11px] text-slate-800 truncate" x-text="bg.name"></div>
                <div class="text-[9px] text-slate-400 truncate" x-text="bg.desc"></div>
              </div>
            </button>
          </template>
        </div>

        <!-- Custom Background Color Input -->
        <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 flex items-center justify-between">
          <div class="flex items-center space-x-2">
            <div class="w-6 h-6 rounded-full border-2 border-white shadow cursor-pointer relative overflow-hidden"
                 :style="`background-color: ${customBgColor}`">
              <input type="color" x-model="customBgColor" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
            </div>
            <div>
              <div class="text-[11px] font-bold text-slate-700">カスタムカラー指定</div>
              <div class="text-[9px] text-slate-400 font-mono" x-text="customBgColor"></div>
            </div>
          </div>
          <button @click="applyCustomBgColor" class="text-xs px-2.5 py-1 bg-white border border-slate-200 rounded-lg hover:bg-slate-100 font-medium text-slate-600 active:scale-95">
            単色に適用
          </button>
        </div>
      </div>

      <!-- Panel 3: Component Assignment -->
      <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200 space-y-3"
           x-show="mobileTab === 'palette' || window.innerWidth >= 1024">
        <h2 class="text-xs font-bold text-slate-700 flex items-center space-x-1.5">
          <i data-lucide="sliders" class="w-4 h-4 text-indigo-600"></i>
          <span>UIコンポーネント配色配置</span>
        </h2>

        <div class="grid grid-cols-2 gap-2 text-xs">
          <div>
            <label class="block text-[11px] text-slate-500 font-medium mb-1">メイン/ヘッダー</label>
            <select x-model="mapping.primaryIndex" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-1.5 font-medium">
              <template x-for="(c, i) in activePalette" :key="i">
                <option :value="i" x-text="`Color ${i+1}`"></option>
              </template>
            </select>
          </div>

          <div>
            <label class="block text-[11px] text-slate-500 font-medium mb-1">グラデーション対照</label>
            <select x-model="mapping.secondaryIndex" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-1.5 font-medium" :disabled="!useGradient">
              <template x-for="(c, i) in activePalette" :key="i">
                <option :value="i" x-text="`Color ${i+1}`"></option>
              </template>
            </select>
          </div>

          <div>
            <label class="block text-[11px] text-slate-500 font-medium mb-1">アクセント/バッジ</label>
            <select x-model="mapping.accentIndex" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-1.5 font-medium">
              <template x-for="(c, i) in activePalette" :key="i">
                <option :value="i" x-text="`Color ${i+1}`"></option>
              </template>
            </select>
          </div>

          <div>
            <label class="block text-[11px] text-slate-500 font-medium mb-1">テーブル見出し</label>
            <select x-model="mapping.tableHeaderIndex" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-1.5 font-medium">
              <template x-for="(c, i) in activePalette" :key="i">
                <option :value="i" x-text="`Color ${i+1}`"></option>
              </template>
            </select>
          </div>
        </div>
      </div>

      <!-- Panel 4: Presets & Storage -->
      <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200 space-y-3"
           x-show="mobileTab === 'theme' || window.innerWidth >= 1024">
        <h2 class="text-xs font-bold text-slate-700 flex items-center space-x-1.5">
          <i data-lucide="layers" class="w-4 h-4 text-indigo-600"></i>
          <span>テーマプリセット</span>
        </h2>

        <div class="space-y-1.5">
          <template x-for="(preset, index) in presetThemes" :key="index">
            <div @click="applyPreset(preset)" class="p-2 rounded-xl border border-slate-100 hover:border-indigo-200 bg-slate-50 flex items-center justify-between cursor-pointer transition active:scale-98">
              <div>
                <div class="text-xs font-bold text-slate-800" x-text="preset.name"></div>
                <div class="text-[10px] text-slate-400" x-text="preset.keywords"></div>
              </div>
              <div class="flex space-x-1 shrink-0">
                <template x-for="c in preset.colors" :key="c">
                  <span class="w-3.5 h-3.5 rounded-full border border-black/10" :style="`background-color: ${c}`"></span>
                </template>
              </div>
            </div>
          </template>
        </div>

        <!-- Saved Palettes -->
        <div class="pt-2 border-t border-slate-100">
          <div class="flex items-center justify-between mb-2">
            <span class="text-[11px] font-bold text-slate-400">マイパレット履歴</span>
            <span class="text-[10px] text-slate-400" x-text="savedPalettes.length + ' 件'"></span>
          </div>

          <template x-if="savedPalettes.length === 0">
            <p class="text-xs text-slate-400 py-1 text-center">保存データはありません</p>
          </template>

          <div class="space-y-1 max-h-36 overflow-y-auto custom-scrollbar">
            <template x-for="(sp, idx) in savedPalettes" :key="idx">
              <div class="flex items-center justify-between p-2 rounded-lg bg-slate-50 border border-slate-100">
                <div class="flex items-center space-x-1 cursor-pointer flex-1" @click="loadSavedPalette(sp)">
                  <template x-for="c in sp" :key="c">
                    <span class="w-3.5 h-3.5 rounded-full border border-black/10" :style="`background-color: ${c}`"></span>
                  </template>
                  <span class="text-[10px] text-slate-400 ml-2" x-text="sp.length + '色'"></span>
                </div>
                <button @click="removeSavedPalette(idx)" class="text-slate-300 hover:text-red-500 p-1">
                  <i data-lucide="trash-2" class="w-3 h-3"></i>
                </button>
              </div>
            </template>
          </div>
        </div>
      </div>

    </section>

    <!-- Preview Stage Column -->
    <section class="lg:col-span-7 xl:col-span-8 flex flex-col space-y-3"
             :class="{ 'hidden lg:flex': mobileTab !== 'preview' }">

      <!-- Header Info & Mobile Navigation Controls -->
      <div class="bg-white rounded-2xl p-3 sm:p-4 shadow-sm border border-slate-200 flex items-center justify-between">
        <div class="min-w-0 flex-1">
          <div class="text-[10px] font-semibold text-slate-400 uppercase">Preview State</div>
          <div class="flex items-center space-x-2 truncate">
            <span class="text-xs sm:text-base font-extrabold text-slate-800 truncate" x-text="activeThemeName"></span>
            <span class="text-[9px] sm:text-[10px] px-2 py-0.5 rounded-md font-bold text-white bg-slate-700 shrink-0" x-text="currentBg.name"></span>
          </div>
        </div>

        <!-- Mobile Carousel Navigation Buttons -->
        <div class="flex items-center space-x-1 lg:hidden shrink-0">
          <button @click="scrollCarousel(-1)" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 active:scale-95">
            <i data-lucide="chevron-left" class="w-4 h-4"></i>
          </button>
          <span class="text-xs font-bold text-slate-600 px-1 font-mono" x-text="(currentCardIndex + 1) + '/3'"></span>
          <button @click="scrollCarousel(1)" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 active:scale-95">
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
          </button>
        </div>

        <!-- Desktop Swatches -->
        <div class="hidden lg:flex space-x-1.5 items-center">
          <template x-for="c in activePalette" :key="c">
            <span class="w-5 h-5 rounded-full border-2 border-white shadow-xs" :style="`background-color: ${c}`"></span>
          </template>
        </div>
      </div>

      <!-- Smartphone Preview Wrapper -->
      <!-- Fixed: justify-start with snap-container prevents left-cut on mobile while keeping full scrollability -->
      <div class="bg-slate-200/80 border border-slate-300 rounded-3xl p-3 sm:p-6 overflow-hidden min-h-[580px] flex flex-col justify-center">
        
        <div id="carouselContainer"
             class="w-full overflow-x-auto custom-scrollbar snap-container flex items-start justify-start lg:justify-center gap-4 sm:gap-6 py-2 px-4 sm:px-2"
             @scroll.debounce.100ms="updateActiveCard">
          
          <!-- Screen 1: Dashboard -->
          <div id="screen-card-0"
               class="snap-card w-[270px] sm:w-[280px] shrink-0 rounded-[38px] shadow-2xl p-3.5 border-[6px] border-slate-800 flex flex-col relative overflow-hidden transition-all duration-300"
               :class="currentBg.patternClass"
               :style="currentBg.style">
            
            <div class="rounded-2xl p-3.5 shadow-md text-white transition-all duration-300"
                 :style="getStyle(getColor(mapping.primaryIndex), getColor(mapping.secondaryIndex), useGradient)">
              <div class="flex items-center justify-between text-xs mb-2">
                <i data-lucide="sparkles" class="w-4 h-4"></i>
                <span class="font-bold tracking-wide">Daily Report</span>
                <i data-lucide="bell" class="w-4 h-4"></i>
              </div>
              <div class="text-[10px] opacity-85">全体アクティビティ</div>
              <div class="text-xl font-black">82.7 <span class="text-xs font-normal">pts</span></div>
            </div>

            <div class="mt-3 space-y-2.5 px-0.5 flex-1">
              <!-- Weekly Chart Widget -->
              <div class="p-2.5 rounded-2xl bg-white/85 backdrop-blur shadow-xs border border-white/60">
                <div class="text-[10px] font-bold text-slate-700">週間推移</div>
                <div class="h-11 w-full mt-1.5 rounded-xl flex items-end gap-1.5 p-1.5 bg-slate-100/70">
                  <template x-for="(c, i) in activePalette" :key="i">
                    <div class="flex-1 rounded-t-md transition-all shadow-xs"
                         :style="`height: ${[45, 80, 60, 95, 70][i % 5]}%; background-color: ${c}`"></div>
                  </template>
                </div>
              </div>

              <!-- Metrics -->
              <div class="grid grid-cols-2 gap-2">
                <div class="p-2.5 rounded-2xl bg-white/85 backdrop-blur shadow-xs border border-white/60 text-center">
                  <div class="text-[9px] text-slate-400">達成度</div>
                  <div class="text-xs font-extrabold mt-0.5 text-slate-700">78%</div>
                </div>
                <div class="p-2.5 rounded-2xl bg-white/85 backdrop-blur shadow-xs border border-white/60 text-center">
                  <div class="text-[9px] text-slate-400">ポイント</div>
                  <div class="text-xs font-extrabold mt-0.5 text-slate-700">24,000</div>
                </div>
              </div>

              <button class="w-full py-2.5 rounded-2xl text-white font-bold text-xs shadow-md transition active:scale-95"
                      :style="getStyle(getColor(mapping.primaryIndex), getColor(mapping.secondaryIndex), useGradient)">
                詳細データ表示
              </button>
            </div>
          </div>

          <!-- Screen 2: Task List -->
          <div id="screen-card-1"
               class="snap-card w-[270px] sm:w-[280px] shrink-0 rounded-[38px] shadow-2xl p-3.5 border-[6px] border-slate-800 flex flex-col relative overflow-hidden transition-all duration-300"
               :class="currentBg.patternClass"
               :style="currentBg.style">
            
            <div class="px-1 pt-1 pb-2">
              <div class="flex justify-between items-center text-[10px] text-slate-400 mb-1">
                <span>09:41</span>
                <i data-lucide="battery-charging" class="w-3.5 h-3.5"></i>
              </div>
              <h3 class="text-base font-extrabold text-slate-800">プロジェクト管理</h3>
            </div>

            <!-- Task List Widget -->
            <div class="rounded-2xl overflow-hidden shadow-xs border border-white/60 mb-2 bg-white/85 backdrop-blur">
              <div class="px-3 py-2 text-[10px] font-bold flex justify-between items-center text-white"
                   :style="`background-color: ${getColor(mapping.tableHeaderIndex)}`">
                <span>タスク名</span>
                <span>状態</span>
              </div>
              <div class="text-[10px] divide-y divide-slate-100">
                <div class="p-2.5 flex justify-between items-center">
                  <span class="font-medium text-slate-700">カラー選定</span>
                  <span class="px-2 py-0.5 rounded-md text-[9px] font-bold text-white shadow-xs" :style="`background-color: ${getColor(mapping.accentIndex)}`">完了</span>
                </div>
                <div class="p-2.5 flex justify-between items-center">
                  <span class="font-medium text-slate-700">モックアップ</span>
                  <span class="px-2 py-0.5 rounded-md text-[9px] font-bold text-white opacity-90 shadow-xs" :style="`background-color: ${getColor(mapping.primaryIndex)}`">対応中</span>
                </div>
                <div class="p-2.5 flex justify-between items-center">
                  <span class="font-medium text-slate-700">デザインレビュー</span>
                  <span class="px-2 py-0.5 rounded-md text-[9px] font-bold bg-slate-200 text-slate-600">未着手</span>
                </div>
              </div>
            </div>

            <button class="mt-auto w-full py-2.5 rounded-2xl text-white font-bold text-xs shadow-md transition active:scale-95"
                    :style="getStyle(getColor(mapping.primaryIndex), getColor(mapping.secondaryIndex), useGradient)">
              ＋ 新規タスク追加
            </button>
          </div>

          <!-- Screen 3: Settings & Profile -->
          <div id="screen-card-2"
               class="snap-card w-[270px] sm:w-[280px] shrink-0 rounded-[38px] shadow-2xl p-3.5 border-[6px] border-slate-800 flex flex-col relative overflow-hidden transition-all duration-300"
               :class="currentBg.patternClass"
               :style="currentBg.style">
            
            <div class="rounded-2xl p-3.5 text-center text-white shadow-md"
                 :style="getStyle(getColor(mapping.primaryIndex), getColor(mapping.secondaryIndex), useGradient)">
              <div class="w-11 h-11 rounded-full border-2 border-white/80 mx-auto mb-1 bg-white/20 flex items-center justify-center shadow-xs">
                <i data-lucide="user" class="w-5 h-5 text-white"></i>
              </div>
              <div class="font-bold text-xs">設定プレビュー</div>
              <div class="text-[9px] opacity-85" x-text="colorCount + '色構成 ＋ ' + currentBg.name"></div>
            </div>

            <div class="mt-3 space-y-2 px-0.5 flex-1">
              <div class="bg-white/85 backdrop-blur p-2.5 rounded-2xl border border-white/60 shadow-xs">
                <div class="text-[9px] text-slate-400">アクセントハイライト</div>
                <div class="flex items-center space-x-1.5 mt-1">
                  <span class="w-3.5 h-3.5 rounded-full shadow-xs" :style="`background-color: ${getColor(mapping.accentIndex)}`"></span>
                  <span class="text-[11px] font-bold text-slate-700">Accent Color</span>
                </div>
              </div>

              <div class="bg-white/85 backdrop-blur p-2.5 rounded-2xl border border-white/60 shadow-xs">
                <div class="text-[9px] text-slate-400">背景テクスチャ</div>
                <div class="text-[11px] font-bold text-slate-700 mt-0.5" x-text="currentBg.name"></div>
              </div>

              <button class="w-full mt-auto py-2.5 rounded-2xl text-white font-bold text-xs shadow-md transition active:scale-95"
                      :style="`background-color: ${getColor(mapping.primaryIndex)}`">
                設定を適用する
              </button>
            </div>
          </div>

        </div>

        <!-- Mobile Pagination Indicator Dots -->
        <div class="flex justify-center items-center space-x-1.5 mt-3 lg:hidden">
          <button @click="scrollToCard(0)" class="w-2.5 h-2.5 rounded-full transition-all"
                  :class="currentCardIndex === 0 ? 'bg-indigo-600 w-5' : 'bg-slate-400/50'"></button>
          <button @click="scrollToCard(1)" class="w-2.5 h-2.5 rounded-full transition-all"
                  :class="currentCardIndex === 1 ? 'bg-indigo-600 w-5' : 'bg-slate-400/50'"></button>
          <button @click="scrollToCard(2)" class="w-2.5 h-2.5 rounded-full transition-all"
                  :class="currentCardIndex === 2 ? 'bg-indigo-600 w-5' : 'bg-slate-400/50'"></button>
        </div>

      </div>
    </section>

  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="lg:hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur border-t border-slate-200 z-50 flex justify-around py-2 pb-safe shadow-lg">
    <button @click="mobileTab = 'palette'"
            class="flex flex-col items-center flex-1 py-1 transition"
            :class="mobileTab === 'palette' ? 'text-indigo-600 font-bold' : 'text-slate-400'">
      <i data-lucide="palette" class="w-5 h-5"></i>
      <span class="text-[10px] mt-0.5">カラー編集</span>
    </button>
    <button @click="mobileTab = 'bg'"
            class="flex flex-col items-center flex-1 py-1 transition"
            :class="mobileTab === 'bg' ? 'text-pink-500 font-bold' : 'text-slate-400'">
      <i data-lucide="image" class="w-4 h-4"></i>
      <span class="text-[10px] mt-0.5">背景着せ替え</span>
    </button>
    <button @click="mobileTab = 'preview'"
            class="flex flex-col items-center flex-1 py-1 transition"
            :class="mobileTab === 'preview' ? 'text-indigo-600 font-bold' : 'text-slate-400'">
      <i data-lucide="smartphone" class="w-5 h-5"></i>
      <span class="text-[10px] mt-0.5">スマホ実機</span>
    </button>
    <button @click="mobileTab = 'theme'"
            class="flex flex-col items-center flex-1 py-1 transition"
            :class="mobileTab === 'theme' ? 'text-indigo-600 font-bold' : 'text-slate-400'">
      <i data-lucide="grid" class="w-5 h-5"></i>
      <span class="text-[10px] mt-0.5">テーマ一覧</span>
    </button>
  </nav>

  <!-- App Controller -->
  <script>
    function themeSimulator() {
      return {
        mobileTab: 'palette',
        currentCardIndex: 0,
        colorCount: 5,
        useGradient: true,

        palette: ['#F8978E', '#F1443D', '#F28E5B', '#F6CA59', '#F6BBBE'],
        activeThemeName: '暖色 ＋ ラウンド ＋ グラデーション',
        
        mapping: {
          primaryIndex: 0,
          secondaryIndex: 1,
          accentIndex: 3,
          tableHeaderIndex: 2
        },

        // App Mockup Background Settings
        customBgColor: '#FDF2F8',
        currentBg: {
          id: 'dots-pink',
          name: 'パステルドット',
          desc: 'かわいい水玉',
          patternClass: 'bg-pattern-dots',
          style: 'background-color: #FDF2F8;'
        },
        bgPresets: [
          {
            id: 'dots-pink',
            name: 'パステルドット',
            desc: 'かわいい水玉',
            patternClass: 'bg-pattern-dots',
            style: 'background-color: #FDF2F8;'
          },
          {
            id: 'grid-cyan',
            name: 'ミントグリッド',
            desc: '爽やか方眼',
            patternClass: 'bg-pattern-grid',
            style: 'background-color: #F0FDFA;'
          },
          {
            id: 'hearts-lavender',
            name: 'ラベンダーポップ',
            desc: 'ふんわりドット',
            patternClass: 'bg-pattern-hearts',
            style: 'background-color: #FAF5FF;'
          },
          {
            id: 'stripes-warm',
            name: 'ミルクティー',
            desc: '斜めストライプ',
            patternClass: 'bg-pattern-stripes',
            style: 'background-color: #FFFBEB;'
          },
          {
            id: 'grad-aurora',
            name: 'オーロラグラデ',
            desc: '幻想的なグラデ',
            patternClass: '',
            style: 'background: linear-gradient(180deg, #FDE047 0%, #F472B6 50%, #C084FC 100%);'
          },
          {
            id: 'grad-sunset',
            name: 'サンセットピーチ',
            desc: '温かみのある夕焼け',
            patternClass: '',
            style: 'background: linear-gradient(135deg, #FFEDD5 0%, #FED7AA 50%, #FECDD3 100%);'
          },
          {
            id: 'grad-cloud',
            name: 'コットンキャンディ',
            desc: '青空パステル',
            patternClass: '',
            style: 'background: linear-gradient(180deg, #E0F2FE 0%, #EDE9FE 100%);'
          },
          {
            id: 'flat-pure-white',
            name: 'ピュアホワイト',
            desc: 'すっきりプレーン白',
            patternClass: '',
            style: 'background-color: #FFFFFF;'
          },
          {
            id: 'flat-soft-slate',
            name: 'ソフトスレート',
            desc: '落ち着いた薄グレー',
            patternClass: '',
            style: 'background-color: #F8FAFC;'
          },
          {
            id: 'dark-navy',
            name: 'ダークネイビー',
            desc: '引き締めダーク',
            patternClass: '',
            style: 'background-color: #0F172A;'
          }
        ],

        presetThemes: [
          {
            name: '暖色グラデーション (5色)',
            keywords: '女性的・温かみ・最新',
            colors: ['#F8978E', '#F1443D', '#F28E5B', '#F6CA59', '#F6BBBE']
          },
          {
            name: 'オーシャン・テック (3色)',
            keywords: '洗練・知的・信頼',
            colors: ['#0284C7', '#0EA5E9', '#0F172A']
          },
          {
            name: 'ナチュラル・アース (2色)',
            keywords: '自然・オーガニック',
            colors: ['#2D6A4F', '#D8F3DC']
          },
          {
            name: 'ポップ・ネオン (4色)',
            keywords: '元気・アクティブ・刺激',
            colors: ['#8B5CF6', '#EC4899', '#06B6D4', '#F59E0B']
          }
        ],

        savedPalettes: [],

        init() {
          const stored = localStorage.getItem('theme_simulator_master');
          if (stored) {
            try { this.savedPalettes = JSON.parse(stored); } catch(e){}
          }
          const storedBg = localStorage.getItem('theme_simulator_bg');
          if (storedBg) {
            try { this.currentBg = JSON.parse(storedBg); } catch(e){}
          }
          this.$nextTick(() => lucide.createIcons());
          this.$watch('palette', () => this.$nextTick(() => lucide.createIcons()));
          this.$watch('mobileTab', () => {
            this.$nextTick(() => {
              lucide.createIcons();
              if (this.mobileTab === 'preview') {
                this.scrollToCard(this.currentCardIndex);
              }
            });
          });
          this.$watch('currentBg', (val) => {
            localStorage.setItem('theme_simulator_bg', JSON.stringify(val));
            this.$nextTick(() => lucide.createIcons());
          });
        },

        // Carousel controls for mobile
        scrollCarousel(direction) {
          let nextIndex = this.currentCardIndex + direction;
          if (nextIndex < 0) nextIndex = 0;
          if (nextIndex > 2) nextIndex = 2;
          this.scrollToCard(nextIndex);
        },

        scrollToCard(index) {
          this.currentCardIndex = index;
          const target = document.getElementById(`screen-card-${index}`);
          const container = document.getElementById('carouselContainer');
          if (target && container) {
            target.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
          }
        },

        updateActiveCard(e) {
          const container = e.target;
          const scrollLeft = container.scrollLeft;
          const cardWidth = 285; // approximate width + gap
          const newIdx = Math.round(scrollLeft / cardWidth);
          this.currentCardIndex = Math.min(Math.max(0, newIdx), 2);
        },

        setColorCount(count) {
          this.colorCount = count;
          this.normalizeIndices();
          this.$nextTick(() => lucide.createIcons());
        },

        get activePalette() {
          return this.palette.slice(0, this.colorCount);
        },

        getColor(idx) {
          const safeIdx = Math.min(Math.max(0, parseInt(idx) || 0), this.colorCount - 1);
          return this.palette[safeIdx] || this.palette[0];
        },

        getStyle(color1, color2, isGradient) {
          if (!isGradient || !color2 || color1 === color2) {
            return `background-color: ${color1};`;
          }
          return `background: linear-gradient(135deg, ${color1}, ${color2});`;
        },

        applyCustomBgColor() {
          this.currentBg = {
            id: 'custom-' + Date.now(),
            name: 'カスタムカラー',
            desc: this.customBgColor,
            patternClass: '',
            style: `background-color: ${this.customBgColor};`
          };
        },

        get isHeaderAccessible() {
          const hex = this.getColor(this.mapping.primaryIndex).replace('#', '');
          if (hex.length !== 6) return true;
          const r = parseInt(hex.substring(0, 2), 16);
          const g = parseInt(hex.substring(2, 4), 16);
          const b = parseInt(hex.substring(4, 6), 16);
          const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
          return yiq < 160;
        },

        normalizeIndices() {
          const maxIdx = this.colorCount - 1;
          if (this.mapping.primaryIndex > maxIdx) this.mapping.primaryIndex = 0;
          if (this.mapping.secondaryIndex > maxIdx) this.mapping.secondaryIndex = maxIdx;
          if (this.mapping.accentIndex > maxIdx) this.mapping.accentIndex = maxIdx;
          if (this.mapping.tableHeaderIndex > maxIdx) this.mapping.tableHeaderIndex = maxIdx;
        },

        applyPreset(preset) {
          this.colorCount = preset.colors.length;
          preset.colors.forEach((c, i) => { this.palette[i] = c; });
          this.activeThemeName = preset.name;
          this.normalizeIndices();
          if (window.innerWidth < 1024) this.mobileTab = 'preview';
        },

        saveToMyPalettes() {
          this.savedPalettes.unshift([...this.activePalette]);
          localStorage.setItem('theme_simulator_master', JSON.stringify(this.savedPalettes));
          this.$nextTick(() => lucide.createIcons());
        },

        loadSavedPalette(colors) {
          this.colorCount = colors.length;
          colors.forEach((c, i) => { this.palette[i] = c; });
          this.normalizeIndices();
          if (window.innerWidth < 1024) this.mobileTab = 'preview';
        },

        removeSavedPalette(idx) {
          this.savedPalettes.splice(idx, 1);
          localStorage.setItem('theme_simulator_master', JSON.stringify(this.savedPalettes));
        },

        randomizeTheme() {
          const randHex = () => '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0').toUpperCase();
          for(let i=0; i<5; i++) { this.palette[i] = randHex(); }
          this.activeThemeName = 'カスタムランダム生成';
        },

        copyCssVariables() {
          let css = ':root {\n';
          this.activePalette.forEach((c, i) => { css += `  --color-${i+1}: ${c};\n`; });
          css += `  --use-gradient: ${this.useGradient ? '1' : '0'};\n`;
          css += `  --app-bg: ${this.currentBg.style.replace('background:', '').replace('background-color:', '').replace(';', '').trim()};\n}`;
          navigator.clipboard.writeText(css).then(() => {
            alert('CSS変数をクリップボードにコピーしました:\n\n' + css);
          });
        },

        copyHexList() {
          const hexes = this.activePalette.join(', ');
          navigator.clipboard.writeText(hexes).then(() => {
            alert('カラーコードをコピーしました:\n' + hexes);
          });
        },

        exportJson() {
          const payload = {
            themeName: this.activeThemeName,
            colorCount: this.colorCount,
            useGradient: this.useGradient,
            palette: this.activePalette,
            mapping: this.mapping,
            currentBg: this.currentBg
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `ui-theme-full-${this.colorCount}c.json`;
          a.click();
          URL.revokeObjectURL(url);
        },

        importJson(e) {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const res = JSON.parse(event.target.result);
              if (res.palette && Array.isArray(res.palette)) {
                this.colorCount = res.palette.length;
                res.palette.forEach((c, i) => { this.palette[i] = c; });
                if (res.useGradient !== undefined) this.useGradient = res.useGradient;
                if (res.themeName) this.activeThemeName = res.themeName;
                if (res.mapping) this.mapping = res.mapping;
                if (res.currentBg) this.currentBg = res.currentBg;
                this.normalizeIndices();
              }
            } catch(err) {
              alert('JSONの読み込みに失敗しました。');
            }
          };
          reader.readAsText(file);
        }
      }
    }
  </script>
</body>
</html>
